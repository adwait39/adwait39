  <text x="24" y="102" font-family="Segoe UI, Inter, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#c9d1d9">Two-tower embedding retrieval with FAISS narrows</text><text x="24" y="125" font-family="Segoe UI, Inter, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#c9d1d9">5M+ candidate–job interactions by 99.9% while</text><text x="24" y="148" font-family="Segoe UI, Inter, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#c9d1d9">keeping 97% of true matches in the top 100;</text><text x="24" y="171" font-family="Segoe UI, Inter, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#c9d1d9">LightGBM reranks on 30+ features (+18% NDCG@10).</text><text x="24" y="194" font-family="Segoe UI, Inter, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#c9d1d9">Served under 80 ms p95 at 1,000+ req/s.</text>
