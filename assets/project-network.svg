  <text x="24" y="70" font-family="Cascadia Code, JetBrains Mono, Fira Code, Consolas, Menlo, monospace" font-size="12.5" fill="#8b949e">Private · Oct – Dec 2025</text>
  <text x="24" y="102" font-family="Segoe UI, Inter, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#c9d1d9">A testbed of 20+ containerized routers running</text><text x="24" y="125" font-family="Segoe UI, Inter, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#c9d1d9">OSPF-style link-state routing, validated by 100+</text><text x="24" y="148" font-family="Segoe UI, Inter, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#c9d1d9">PyTest/Scapy regression tests and 50+ injected</text><text x="24" y="171" font-family="Segoe UI, Inter, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#c9d1d9">failures. Angular + RxJS + WebSockets dashboard</text><text x="24" y="194" font-family="Segoe UI, Inter, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#c9d1d9">renders the live topology.</text>
