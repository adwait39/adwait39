<svg xmlns="http://www.w3.org/2000/svg" width="590" height="264" viewBox="0 0 590 264" role="img" aria-label="Music Separation as a Service">
  <defs>
    <linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#bc8cff"/></linearGradient>
    <radialGradient id="glowA" cx="0%" cy="0%" r="70%"><stop offset="0" stop-color="#1f6feb" stop-opacity="0.35"/><stop offset="1" stop-color="#1f6feb" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="100%" cy="100%" r="70%"><stop offset="0" stop-color="#8957e5" stop-opacity="0.30"/><stop offset="1" stop-color="#8957e5" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#30363d"/></pattern>
  </defs>
  <clipPath id="clip"><rect width="590" height="264" rx="16"/></clipPath>
  <g clip-path="url(#clip)"><rect width="590" height="264" fill="#0d1117"/></g>
  <rect x="0.5" y="0.5" width="589" height="263" rx="16" fill="none" stroke="#30363d"/>
  <rect x="0" y="0" width="590" height="4" fill="#bc8cff" clip-path="url(#clip)"/>
  <text x="28" y="48" font-family="Segoe UI, Inter, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="700" fill="#f0f6fc">Music Separation as a Service</text>
  <text x="28" y="72" font-family="Cascadia Code, JetBrains Mono, Fira Code, Consolas, Menlo, monospace" font-size="12" fill="#8b949e">Open source · Sep – Dec 2025</text>
  <text x="28" y="104" font-family="Segoe UI, Inter, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="14.5" fill="#c9d1d9">Kubernetes/GKE backend that splits songs into four stems with Demucs. Jobs</text><text x="28" y="126" font-family="Segoe UI, Inter, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="14.5" fill="#c9d1d9">run 3–4x the audio length, so they flow through Redis queues to worker</text><text x="28" y="148" font-family="Segoe UI, Inter, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="14.5" fill="#c9d1d9">pods and land in MinIO; API, queue and workers scale independently,</text><text x="28" y="170" font-family="Segoe UI, Inter, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="14.5" fill="#c9d1d9">observed with Prometheus and Grafana.</text>
  <rect x="28" y="196" width="101" height="24" rx="12" fill="#1c2129" stroke="#30363d"/><circle cx="41" cy="208" r="3.5" fill="#58a6ff"/><text x="51" y="212.5" font-family="Cascadia Code, JetBrains Mono, Fira Code, Consolas, Menlo, monospace" font-size="11.5" fill="#c9d1d9">Kubernetes</text><rect x="137" y="196" width="51" height="24" rx="12" fill="#1c2129" stroke="#30363d"/><circle cx="150" cy="208" r="3.5" fill="#58a6ff"/><text x="160" y="212.5" font-family="Cascadia Code, JetBrains Mono, Fira Code, Consolas, Menlo, monospace" font-size="11.5" fill="#c9d1d9">GKE</text><rect x="196" y="196" width="65" height="24" rx="12" fill="#1c2129" stroke="#30363d"/><circle cx="209" cy="208" r="3.5" fill="#f778ba"/><text x="219" y="212.5" font-family="Cascadia Code, JetBrains Mono, Fira Code, Consolas, Menlo, monospace" font-size="11.5" fill="#c9d1d9">Redis</text><rect x="269" y="196" width="65" height="24" rx="12" fill="#1c2129" stroke="#30363d"/><circle cx="282" cy="208" r="3.5" fill="#f778ba"/><text x="292" y="212.5" font-family="Cascadia Code, JetBrains Mono, Fira Code, Consolas, Menlo, monospace" font-size="11.5" fill="#c9d1d9">MinIO</text><rect x="342" y="196" width="101" height="24" rx="12" fill="#1c2129" stroke="#30363d"/><circle cx="355" cy="208" r="3.5" fill="#d29922"/><text x="365" y="212.5" font-family="Cascadia Code, JetBrains Mono, Fira Code, Consolas, Menlo, monospace" font-size="11.5" fill="#c9d1d9">Prometheus</text><rect x="451" y="196" width="79" height="24" rx="12" fill="#1c2129" stroke="#30363d"/><circle cx="464" cy="208" r="3.5" fill="#d29922"/><text x="474" y="212.5" font-family="Cascadia Code, JetBrains Mono, Fira Code, Consolas, Menlo, monospace" font-size="11.5" fill="#c9d1d9">Grafana</text>
</svg>
