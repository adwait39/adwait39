  <text x="28" y="104" font-family="Segoe UI, Inter, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="14.5" fill="#c9d1d9">Two-tower embedding retrieval with FAISS narrows 5M+ candidate–job</text><text x="28" y="126" font-family="Segoe UI, Inter, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="14.5" fill="#c9d1d9">interactions by 99.9% while keeping 97% of true matches in the top 100;</text><text x="28" y="148" font-family="Segoe UI, Inter, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="14.5" fill="#c9d1d9">LightGBM reranks on 30+ features (+18% NDCG@10). Served under 80 ms p95 at</text><text x="28" y="170" font-family="Segoe UI, Inter, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="14.5" fill="#c9d1d9">1,000+ req/s.</text>
