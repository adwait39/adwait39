<svg xmlns="http://www.w3.org/2000/svg" width="440" height="322" viewBox="0 0 440 322" role="img" aria-label="Agentic AI Incident Response">
  <defs>
    <linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#bc8cff"/></linearGradient>
    <radialGradient id="glowA" cx="0%" cy="0%" r="70%"><stop offset="0" stop-color="#1f6feb" stop-opacity="0.35"/><stop offset="1" stop-color="#1f6feb" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="100%" cy="100%" r="70%"><stop offset="0" stop-color="#8957e5" stop-opacity="0.30"/><stop offset="1" stop-color="#8957e5" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#30363d"/></pattern>
  </defs>
  <clipPath id="clip"><rect width="440" height="322" rx="16"/></clipPath>
  <g clip-path="url(#clip)"><rect width="440" height="322" fill="#0d1117"/></g>
  <rect x="0.5" y="0.5" width="439" height="321" rx="16" fill="none" stroke="#30363d"/>
  <rect x="0" y="0" width="440" height="4" fill="#d29922" clip-path="url(#clip)"/>
  <text x="24" y="46" font-family="Segoe UI, Inter, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#f0f6fc">Agentic AI Incident Response</text>
  <text x="24" y="70" font-family="Cascadia Code, JetBrains Mono, Fira Code, Consolas, Menlo, monospace" font-size="12.5" fill="#8b949e">In progress · design doc first</text>
  <text x="24" y="102" font-family="Segoe UI, Inter, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#c9d1d9">An on-call copilot. Alertmanager fires, a</text><text x="24" y="125" font-family="Segoe UI, Inter, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#c9d1d9">LangGraph state machine triages, diagnoses and</text><text x="24" y="148" font-family="Segoe UI, Inter, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#c9d1d9">verifies against logs, metrics, Kubernetes state</text><text x="24" y="171" font-family="Segoe UI, Inter, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#c9d1d9">and runbooks, then proposes a fix that only runs</text><text x="24" y="194" font-family="Segoe UI, Inter, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#c9d1d9">after a human approves.</text>
  <rect x="24" y="221" width="96" height="24" rx="12" fill="#1c2129" stroke="#30363d"/><circle cx="37" cy="233" r="3.5" fill="#3fb950"/><text x="47" y="237.5" font-family="Cascadia Code, JetBrains Mono, Fira Code, Consolas, Menlo, monospace" font-size="12" fill="#c9d1d9">LangGraph</text><rect x="128" y="221" width="82" height="24" rx="12" fill="#1c2129" stroke="#30363d"/><circle cx="141" cy="233" r="3.5" fill="#3fb950"/><text x="151" y="237.5" font-family="Cascadia Code, JetBrains Mono, Fira Code, Consolas, Menlo, monospace" font-size="12" fill="#c9d1d9">FastAPI</text><rect x="218" y="221" width="104" height="24" rx="12" fill="#1c2129" stroke="#30363d"/><circle cx="231" cy="233" r="3.5" fill="#d29922"/><text x="241" y="237.5" font-family="Cascadia Code, JetBrains Mono, Fira Code, Consolas, Menlo, monospace" font-size="12" fill="#c9d1d9">Prometheus</text><rect x="24" y="253" width="104" height="24" rx="12" fill="#1c2129" stroke="#30363d"/><circle cx="37" cy="265" r="3.5" fill="#58a6ff"/><text x="47" y="269.5" font-family="Cascadia Code, JetBrains Mono, Fira Code, Consolas, Menlo, monospace" font-size="12" fill="#c9d1d9">Kubernetes</text><rect x="136" y="253" width="156" height="24" rx="12" fill="#1c2129" stroke="#30363d"/><circle cx="149" cy="265" r="3.5" fill="#bc8cff"/><text x="159" y="269.5" font-family="Cascadia Code, JetBrains Mono, Fira Code, Consolas, Menlo, monospace" font-size="12" fill="#c9d1d9">Human-in-the-loop</text>
</svg>
